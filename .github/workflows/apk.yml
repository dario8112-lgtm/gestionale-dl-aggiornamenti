name: App Android Cassaforte DL
on:
  push:
    branches: [cassaforte-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Chiave di firma
        env: { KS: '${{ secrets.CDL_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then printf "%s" "$KS" | tr -d " \r\n\t" | base64 -d > app/firma.jks; echo "CDL_KEYSTORE=firma.jks" >> $GITHUB_ENV
          else echo "::warning::Chiave di firma mancante: build di prova con chiave temporanea"
            keytool -genkeypair -keystore app/firma.jks -alias cassaforte -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Prova"
            echo "CDL_KS_PASS=android" >> $GITHUB_ENV; fi
      - name: Compila APK
        env:
          CDL_KEYSTORE: firma.jks
          CDL_KEY_ALIAS: cassaforte
        run: |
          [ -z "$CDL_KS_PASS" ] && export CDL_KS_PASS='${{ secrets.CDL_KS_PASS }}'
          gradle :app:assembleRelease --no-daemon
      - name: Pubblica
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/release/app-release.apk CassaforteDL.apk
          gh release delete cassaforte-android -y --cleanup-tag || true
          gh release create cassaforte-android CassaforteDL.apk --target "$GITHUB_SHA" \
            --title "Cassaforte DL per Android (build ${{ github.run_number }})" \
            --notes "App Android della Cassaforte DL. Scarica CassaforteDL.apk sul telefono e installalo."
